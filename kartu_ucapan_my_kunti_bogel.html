  <!-- ==================== JAVASCRIPT INTERAKTIVITAS & ANIMASI ==================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 0. Mekanisme Fallback Otomatis Foto (.jpeg -> .jpg -> .png -> placeholder)
      const fallbackExtensions = ['jpeg', 'jpg', 'png'];
      document.querySelectorAll('.local-photo-slot').forEach((img) => {
        let attemptIndex = 0; // 0 = .jpeg (sudah di src awal), 1 = .jpg, 2 = .png
        img.addEventListener('error', () => {
          // Abaikan jika user sudah memuat foto via FileReader (data URL)
          if (img.src.startsWith('data:')) return;
          attemptIndex++;
          const baseName = img.getAttribute('data-base');
          if (baseName && attemptIndex < fallbackExtensions.length) {
            img.src = `${baseName}.${fallbackExtensions[attemptIndex]}`;
          } else {
            const placeholderUrl = img.getAttribute('data-placeholder');
            if (placeholderUrl && img.src !== placeholderUrl) {
              img.src = placeholderUrl;
            }
          }
        });
      });

      // Penyimpanan data permanen untuk fitur Export HTML Utuh
      const embeddedPhotos = {};
      let embeddedAudioDataUrl = window.__EMBEDDED_BGM_DATA__ || null;
      let embeddedAudioName = window.__EMBEDDED_BGM_NAME__ || null;

      // 1. Setup Efek Suara Lembut & Backsound Player (Web Audio API + HTML5 Audio MP3/URL)
      let synth = null;
      let bgmGain = null;
      let bgmLoopTimer = null;
      let bgmStepIndex = 0;
      let isBgmPlaying = false;
      let bgmVolume = 0.55;
      let audioMode = 'synth'; // 'synth' | 'custom'

      // Elemen Audio HTML5 untuk MP3 lokal / Data URL / URL eksternal
      const customAudioEl = new Audio();
      customAudioEl.loop = true;
      customAudioEl.preload = 'auto';
      customAudioEl.volume = bgmVolume;

      const musicToggleBtn = document.getElementById('music-toggle-btn');
      const musicIcon = document.getElementById('music-icon');
      const musicEq = document.getElementById('music-eq');
      const musicStatusLabel = document.getElementById('music-status-label');
      const musicSubLabel = document.getElementById('music-sub-label');
      const musicVolumeSlider = document.getElementById('music-volume-slider');

      // Cek apakah ada audio tertanam (dari hasil Export Permanen) atau file lokal backsound.mp3
      if (embeddedAudioDataUrl) {
        audioMode = 'custom';
        customAudioEl.src = embeddedAudioDataUrl;
        musicStatusLabel.textContent = embeddedAudioName || 'Lagu Spesial Berdua';
        musicSubLabel.textContent = 'Backsound siap • Klik play atau buka surat';
      } else {
        // Coba cek keberadaan backsound.mp3 secara diam-diam di folder lokal
        const probeLocalMp3 = new Audio('backsound.mp3');
        probeLocalMp3.addEventListener('canplaythrough', () => {
          if (!embeddedAudioDataUrl && audioMode === 'synth' && !isBgmPlaying) {
            audioMode = 'custom';
            customAudioEl.src = 'backsound.mp3';
            musicStatusLabel.textContent = 'Backsound Spesial (MP3)';
            musicSubLabel.textContent = 'File lokal siap • Klik play atau buka surat';
          }
        }, { once: true });
      }

      // Pola melodi akustik lembut bergaya romantis & sedikit tengil (chord progression hangat)
// ... existing code ...
      if (customAudioFileInput) {
        customAudioFileInput.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          stopSynthLoop();
          audioMode = 'custom';
          const cleanName = file.name.replace(/\.[^/.]+$/, '');
          embeddedAudioName = cleanName || 'Lagu Spesial Berdua';

          const reader = new FileReader();
          reader.onload = async (ev) => {
            embeddedAudioDataUrl = ev.target.result;
            customAudioEl.src = embeddedAudioDataUrl;
            customAudioEl.load();
            updateMusicUI(false, embeddedAudioName, 'Memuat file audio...');
            await playBacksound();
          };
          reader.readAsDataURL(file);
        });
      }

      if (applyAudioUrlBtn && customAudioUrlInput) {
        applyAudioUrlBtn.addEventListener('click', async () => {
          const rawUrl = customAudioUrlInput.value.trim();
          if (!rawUrl) return;
          stopSynthLoop();
          audioMode = 'custom';
          embeddedAudioDataUrl = rawUrl;
          embeddedAudioName = rawUrl;
          customAudioEl.src = rawUrl;
          customAudioEl.load();
          updateMusicUI(false, rawUrl, 'Memuat audio dari tautan...');
          await playBacksound();
        });
      }

      customAudioEl.addEventListener('error', () => {
        if (audioMode === 'custom') {
          audioMode = 'synth';
          updateMusicUI(false, 'Melodi Romantis Tengil', 'File audio tidak ditemukan, beralih ke melodi bawaan');
        }
      });

      if (resetSynthMusicBtn) {
        resetSynthMusicBtn.addEventListener('click', async () => {
          try {
            customAudioEl.pause();
            customAudioEl.removeAttribute('src');
          } catch (err) {
            // Abaikan
          }
          embeddedAudioDataUrl = null;
          embeddedAudioName = null;
          if (customAudioFileInput) customAudioFileInput.value = '';
          if (customAudioUrlInput) customAudioUrlInput.value = '';
          audioMode = 'synth';
          updateMusicUI(false, 'Melodi Romantis Tengil', 'Backsound bawaan siap');
          await playBacksound();
        });
      }

      // 2. Interaksi Buka Amplop Pembuka + Auto-start Backsound
<!-- ... existing code ... -->
      // 6. Logika Mode Ganti Foto (Preview Trial langsung di browser) & Export HTML Permanen
      const toggleTrialBtn = document.getElementById('toggle-trial-drawer');
      const trialModal = document.getElementById('trial-modal');
      const closeTrialBtn = document.getElementById('close-trial-modal');
      const doneTrialBtn = document.getElementById('done-trial-modal');
      const exportHtmlBtn = document.getElementById('export-html-btn');
      const exportStatusMsg = document.getElementById('export-status-msg');
      const fileInputs = document.querySelectorAll('.trial-file-input');

      const openModal = () => {
        trialModal.classList.remove('hidden');
        trialModal.classList.add('flex');
      };

      const closeModal = () => {
        trialModal.classList.add('hidden');
        trialModal.classList.remove('flex');
      };

      toggleTrialBtn.addEventListener('click', openModal);
      closeTrialBtn.addEventListener('click', closeModal);
      doneTrialBtn.addEventListener('click', closeModal);

      // Kompres ringan & ubah gambar ke Data URL agar ukuran file HTML hasil export tetap ramping
      const convertImageToDataUrl = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 1400;
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.86));
            };
            img.onerror = () => resolve(e.target.result);
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      fileInputs.forEach((input) => {
        input.addEventListener('change', async (event) => {
          const file = event.target.files && event.target.files[0];
          const targetId = event.target.getAttribute('data-target');
          const targetImg = document.getElementById(targetId);

          if (file && targetImg) {
            const dataUrl = await convertImageToDataUrl(file);
            embeddedPhotos[targetId] = dataUrl;
            targetImg.src = dataUrl;
          }
        });
      });

      // Fungsi Download 1 File HTML Mandiri Tanpa Tombol Trial
      if (exportHtmlBtn) {
        exportHtmlBtn.addEventListener('click', () => {
          try {
            exportStatusMsg.classList.remove('hidden');
            exportStatusMsg.textContent = 'Sedang merakit file HTML utuh...';

            // Kloning dokumen saat ini agar bersih dari state sementara
            const clonedDoc = document.documentElement.cloneNode(true);

            // Reset amplop pembuka agar saat pacar membuka file, amplop tertutup rapi dari awal
            const clonedEnvelope = clonedDoc.querySelector('#envelope-screen');
            if (clonedEnvelope) {
              clonedEnvelope.classList.remove('opened');
              clonedEnvelope.style.display = '';
            }

            // Hapus tombol floating & modal trial dari versi final siap kirim
            const clonedFloating = clonedDoc.querySelector('#trial-floating-wrapper');
            const clonedModal = clonedDoc.querySelector('#trial-modal');
            if (clonedFloating) clonedFloating.remove();
            if (clonedModal) clonedModal.remove();

            // Tanamkan foto yang dipilih (atau yang sedang tampil) secara permanen ke dalam tag <img>
            for (let i = 1; i <= 5; i++) {
              const slotId = `img-slot-${i}`;
              const clonedImg = clonedDoc.querySelector(`#${slotId}`);
              if (clonedImg) {
                if (embeddedPhotos[slotId]) {
                  clonedImg.setAttribute('src', embeddedPhotos[slotId]);
                } else {
                  const liveImg = document.getElementById(slotId);
                  if (liveImg && liveImg.src && liveImg.src.startsWith('data:')) {
                    clonedImg.setAttribute('src', liveImg.src);
                  }
                }
              }
            }

            // Reset status tombol equalizer ke posisi awal sebelum di-klik
            const clonedEq = clonedDoc.querySelector('#music-eq');
            const clonedIcon = clonedDoc.querySelector('#music-icon');
            if (clonedEq) clonedEq.classList.remove('eq-playing');
            if (clonedIcon) clonedIcon.textContent = '▶';

            // Sisipkan skrip konfigurasi backsound jika ada audio kustom yang dipilih
            if (embeddedAudioDataUrl) {
              const configScript = clonedDoc.ownerDocument.createElement('script');
              configScript.textContent = `window.__EMBEDDED_BGM_DATA__ = ${JSON.stringify(embeddedAudioDataUrl)}; window.__EMBEDDED_BGM_NAME__ = ${JSON.stringify(embeddedAudioName || 'Lagu Spesial Berdua')};`;
              const headEl = clonedDoc.querySelector('head');
              if (headEl) headEl.appendChild(configScript);
            }

            const finalHtml = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
            const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
            const downloadUrl = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'kartu-ucapan-kunti-bogel.html';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 3000);

            exportStatusMsg.textContent = '✅ Berhasil! File "kartu-ucapan-kunti-bogel.html" sudah terunduh dan siap langsung dikirim.';
          } catch (err) {
            exportStatusMsg.textContent = '⚠️ Gagal merakit file: ' + (err.message || 'Coba ulangi kembali.');
          }
        });
      }
    });
  </script>
